apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  labels:
    {{- include "agrifog.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app: mosquitto
    {{- include "agrifog.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
        {{- include "agrifog.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image | quote }}
          ports:
            - containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: 1883
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    {{- include "agrifog.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: {{ .Values.mosquitto.nodePort }}
