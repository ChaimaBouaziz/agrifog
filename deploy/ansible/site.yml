# Responsable : Ines · Semaine 3 — installer un nœud fog complet, d'une seule commande.
#
#   cd deploy/ansible
#   ansible-playbook -i inventory.ini site.yml -l fog-b        # (fog-a chez Chaima)
#
# Étapes : outils -> registry local -> cluster K3s (k3d) -> images -> déploiement Helm.
# Rejouable : une étape déjà faite est sautée (idempotence).
#
# GitOps (semaine 5) :  ... site.yml -l fog-b -e gitops=true
#   au lieu de lancer Helm, Ansible installe Flux ; Flux déploie depuis GitHub (branche main)
#   et réapplique tout seul chaque changement mergé.
- name: Installer un nœud fog AgriFog
  hosts: fogs
  gather_facts: true
  roles:
    - tools
    - registry
    - cluster
    - images
    - role: deploy
      when: not (gitops | bool)
    - role: flux
      when: gitops | bool
