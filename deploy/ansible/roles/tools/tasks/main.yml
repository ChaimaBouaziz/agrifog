- name: Docker doit répondre (Docker Desktop + intégration WSL activée)
  ansible.builtin.command: docker info --format "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0

- name: Dossier des outils
  ansible.builtin.file:
    path: "{{ bin_dir }}"
    state: directory
    mode: "0755"

- name: k3d (K3s dans Docker)
  ansible.builtin.get_url:
    url: "https://github.com/k3d-io/k3d/releases/download/{{ k3d_version }}/k3d-linux-amd64"
    dest: "{{ bin_dir }}/k3d"
    mode: "0755"
    timeout: 120

- name: kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: "{{ bin_dir }}/kubectl"
    mode: "0755"
    timeout: 120

- name: Helm est-il déjà installé ?
  ansible.builtin.stat:
    path: "{{ bin_dir }}/helm"
  register: helm_bin

- name: Helm (archive)
  when: not helm_bin.stat.exists
  block:
    - name: Télécharger Helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        timeout: 120
    - name: Extraire Helm
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true
    - name: Installer Helm
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: "{{ bin_dir }}/helm"
        mode: "0755"
        remote_src: true

- name: Versions installées
  ansible.builtin.command: "{{ bin_dir }}/{{ item }}"
  loop: ["k3d version", "kubectl version --client", "helm version --short"]
  register: versions
  changed_when: false

- name: Afficher les versions
  ansible.builtin.debug:
    msg: "{{ versions.results | map(attribute='stdout_lines') | map('first') | list }}"
