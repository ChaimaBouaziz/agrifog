- name: Déployer (ou mettre à jour) les services du fog avec Helm
  ansible.builtin.command: >-
    {{ bin_dir }}/helm upgrade --install agrifog {{ repo_root }}/deploy/helm/agrifog
    -f {{ repo_root }}/deploy/helm/agrifog/values-{{ fog_id }}.yaml
    --set tag={{ image_tag }}
    --wait --timeout 10m
  register: helm_out
  changed_when: true

- name: Redémarrer les pods (pour reprendre les images "dev" fraîchement poussées)
  ansible.builtin.command: "{{ bin_dir }}/kubectl rollout restart deployment"
  changed_when: true

- name: Attendre que chaque service soit prêt
  ansible.builtin.command: "{{ bin_dir }}/kubectl rollout status deployment/{{ item }} --timeout=300s"
  loop: "{{ ['mosquitto'] + (images | map(attribute='name') | list) }}"
  changed_when: false

- name: État du fog
  ansible.builtin.command: "{{ bin_dir }}/kubectl get pods,svc -o wide"
  register: state
  changed_when: false

- name: Résultat
  ansible.builtin.debug:
    msg: "{{ state.stdout_lines + ['', 'API du moteur : http://localhost:' ~ api_host_port ~ '/zones',
                                   'MQTT du cluster : localhost:' ~ mqtt_host_port] }}"
