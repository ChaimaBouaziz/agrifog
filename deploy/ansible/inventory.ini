# Un fog = une ligne. Le playbook tourne SUR le PC du fog (dans WSL), d'où la connexion "local" :
#   ansible-playbook -i inventory.ini site.yml -l fog-b
# Ajouter une parcelle = ajouter une ligne ici (et un config/<fog>.yaml).
[fogs]
fog-a fog_id=fog-a owner=chaima crop=tomate
fog-b fog_id=fog-b owner=ines   crop=olivier

[fogs:vars]
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
