# Prometheus d'un fog : récupère les métriques du fog-exporter toutes les 5 s.
global:
  scrape_interval: 5s          # court pour la démo (horloge simulée accélérée)
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: agrifog
    static_configs:
      - targets: ["fog-exporter:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
