# Environnement d'un fog (sans K3s).
#   cd deploy/compose ; $env:FOG_ID="fog-a"   (ou "fog-b")
#   docker compose up -d                          # broker + base de données
#   docker compose --profile monitoring up -d     # + supervision (exporter, Prometheus, Grafana, Alertmanager)
name: agrifog   # nom de projet fixe : ne se mélange pas avec d'autres projets lancés depuis un dossier "compose"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20   # version figée (bonne pratique : pas de mise à jour surprise)
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # bridge propre à chaque fog : FOG_ID=fog-a active le bridge vers fog-b
      - ./mosquitto/bridges/${FOG_ID:-fog-b}:/mosquitto/config/conf.d:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: agrifog
      DOCKER_INFLUXDB_INIT_PASSWORD: agrifog-dev-only
      DOCKER_INFLUXDB_INIT_ORG: agrifog
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: agrifog-dev-token
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

  # ------------------------------------------------------------ supervision (semaine 3)
  fog-exporter:              # MQTT -> métriques Prometheus + signe de vie du fog
    profiles: [monitoring]
    build:
      context: ../..
      dockerfile: services/fog-exporter/Dockerfile
    image: agrifog/fog-exporter:dev
    environment:
      FOG_ID: ${FOG_ID:-fog-b}
      MQTT_HOST: mosquitto
    volumes:
      - ../../config:/srv/config:ro
    ports: ["9108:9108"]
    depends_on: [mosquitto]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agrifog-dev-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # démo : lecture sans compte
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agrifog-irrigation.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  influx-data:
  prometheus-data:
  grafana-data:
