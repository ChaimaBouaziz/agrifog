# Environnement de dev d'un fog (sans K3s).
#   docker compose -f deploy/compose/docker-compose.yml up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # bridge propre à chaque fog : FOG_ID=fog-a active le bridge vers fog-b
      - ./mosquitto/bridges/${FOG_ID:-fog-b}:/mosquitto/config/conf.d:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: agrifog
      DOCKER_INFLUXDB_INIT_PASSWORD: agrifog-dev-only
      DOCKER_INFLUXDB_INIT_ORG: agrifog
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: agrifog-dev-token
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

volumes:
  influx-data:
