# Relais Wokwi (fog-b) : l'ESP32 simulé dans Wokwi (cloud) ne voit pas ce broker local.
# Il publie sur un broker public avec un préfixe propre au projet ; ce bridge fait
# correspondre   fog-b/zone/zw/...   <->   agrifog-enis-2026/fog-b/zone/zw/...
# Le préfixe doit être IDENTIQUE à TOPIC_PREFIX dans firmware/platformio.ini.
connection relay-wokwi
# IP de test.mosquitto.org d'abord (le nom peut se résoudre en IPv6, injoignable depuis Docker Desktop),
# puis le nom en secours. Si le broker change d'IP : Test-NetConnection test.mosquitto.org -Port 1883
address 54.36.178.49:1883 test.mosquitto.org:1883
round_robin false
cleansession true
# se présenter comme un client normal (pas comme un pont) au broker public
try_private false
restart_timeout 5 30
# Sens explicite pour chaque topic (pas de "both" : avec try_private false, un message
# renvoyé par le broker public reviendrait en double).
# ESP32 -> fog : mesures, accusés de vanne, signes de vie, statuts OTA
topic zone/zw/telemetry in 1 fog-b/ agrifog-enis-2026/fog-b/
topic zone/zw/valve in 1 fog-b/ agrifog-enis-2026/fog-b/
topic device/esp-b-wokwi/heartbeat in 1 fog-b/ agrifog-enis-2026/fog-b/
topic device/esp-b-wokwi/ota/status in 1 fog-b/ agrifog-enis-2026/fog-b/
# fog -> ESP32 : ordres d'arrosage et ordres de mise à jour
topic zone/zw/cmd out 1 fog-b/ agrifog-enis-2026/fog-b/
topic device/esp-b-wokwi/ota out 1 fog-b/ agrifog-enis-2026/fog-b/
