fog_id: fog-a
owner: Chaima
neighbor: fog-b

location:          # Sfax
  latitude: 34.74
  longitude: 10.76

crop:
  name: tomate
  kc: 1.05          # coefficient cultural (à affiner par stade)
  root_depth_mm: 600   # profondeur racinaire
  p: 0.4             # fraction facilement utilisable (FAO-56)
  moisture_threshold_pct: 23   # = CC - p*(CC-PF) : début du stress

soil:
  type: sablo-limoneux
  field_capacity_pct: 30   # valeurs de départ, réglées en semaine 6
  wilting_point_pct: 12

zones:
  - id: z1
    devices: [esp-a-01, esp-a-02, esp-a-03]
    area_m2: 200
    flow_lpm: 20
  - id: z2
    devices: [esp-a-04, esp-a-05, esp-a-06]
    area_m2: 200
    flow_lpm: 20
  - id: z3
    devices: [esp-a-07, esp-a-08, esp-a-09, esp-a-10]
    area_m2: 200
    flow_lpm: 20

mqtt:
  host: 127.0.0.1   # pas "localhost" : sous Windows il part en IPv6 vers WSL
  port: 1883
  fallback_brokers: [fog-b]

simulation:
  speed: 360          # 1 s réelle = 6 min simulées (1 jour = 4 min)
  wake_period_s: 10   # deep sleep des ESP32, en secondes réelles
