; Responsable : Ines
; Firmware v2 : MQTT, heartbeat, vanne (relais), deep sleep — même JSON que le simulateur.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7
build_flags =
    -DFW_VERSION=\"0.2.0\"
    -DFOG_ID=\"fog-b\"
    -DDEVICE_ID=\"esp-b-wokwi\"
    -DZONE_ID=\"zw\"
    ; Wokwi ne voit pas le broker du fog : broker public de test + préfixe propre au projet.
    ; Changer le préfixe pour qu'il soit unique (et le reporter dans relay-wokwi.conf).
    -DMQTT_HOST=\"test.mosquitto.org\"
    -DTOPIC_PREFIX=\"agrifog-enis-2026/\"
    -DPERIOD_S=10
    -DTIME_SCALE=60
    ; Wokwi : veille simulée (le deep sleep de Wokwi redémarre par TG1WDT). Carte réelle : 1.
    -DFW_DEEP_SLEEP=0